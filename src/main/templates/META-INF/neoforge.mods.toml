
modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"

issueTrackerURL="https://github.com/hexqua/artifices_assortie/issues"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

authors="Aquid"

logoFile="artifices_asortie_logo.png"

description='''
A small assortment of gun-related additions for crafters.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="irons_artifice"
    type="required"
    versionRange="[${irons_artifice_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="irons_lib"
    type="required"
    versionRange="[${irons_lib_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="create"
    type="optional"
    versionRange="[${create_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="irons_spellbooks"
    type="optional"
    versionRange="[${irons_spells_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="malum"
    type="optional"
    versionRange="[${malum_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="jei"
    type="optional"
    versionRange="[${jei_version},)"
    ordering="AFTER"
    side="CLIENT"
