plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude('**/.cache/**')
}

repositories {
    maven {
        url = uri('https://api.modrinth.com/maven')
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
def gameTestWorldName = 'artifices_gametest_clean'

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version
    runs {
        configureEach { gameDirectory = file('run/26.1.2') }
        client { client() }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'artificesassortie.requiredOptionalMods', providers.gradleProperty('withoutJei').isPresent() ? 'jade,moonlight,dummmmmmy' : 'jei,mezz_config,jade,moonlight,dummmmmmy'
            systemProperty 'artificesassortie.excludedProfileMods', providers.gradleProperty('withoutJei').isPresent() ? 'jei,create,irons_spellbooks,malum' : 'create,irons_spellbooks,malum'
            programArguments.addAll '--world', gameTestWorldName
        }
        data {
            clientData()
            ideName = ''
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}
def cleanWorld = tasks.register('cleanGameTestServerWorld', Delete) {
    delete layout.projectDirectory.dir("run/26.1.2/${gameTestWorldName}")
}
tasks.named('runGameTestServer').configure { dependsOn cleanWorld }

apply from: 'scripts/text-encoding.gradle'

tasks.named('jar', Jar).configure {
    // リポジトリの原本を同梱し、配布物だけでもコードと素材の利用条件を確認できるようにする。
    includeEmptyDirs = false
    from('LICENSE', 'ASSETS_LICENSE.md', 'THIRD_PARTY_NOTICES.md')
    exclude('jp/aquafactory/artificesassorite/gametest/**')
    exclude('data/artificesassortie/structure/gametest/**')
}

dependencies {
    implementation "maven.modrinth:irons-artifice:${irons_artifice_modrinth_version_id}"
    implementation "maven.modrinth:geckolib:${geckolib_modrinth_version_id}"
    implementation "maven.modrinth:irons-lib:${irons_lib_modrinth_version_id}"
    compileOnly "maven.modrinth:jei:${jei_modrinth_version_id}"
    if (!providers.gradleProperty('withoutJei').isPresent()) {
        localRuntime "maven.modrinth:jei:${jei_modrinth_version_id}"
        localRuntime "maven.modrinth:mezzconfig:${mezzconfig_modrinth_version_id}"
    }
    localRuntime "maven.modrinth:jade:${jade_modrinth_version_id}"
    localRuntime "maven.modrinth:moonlight:${moonlight_modrinth_version_id}"
    localRuntime "maven.modrinth:Adega8YN:${target_dummy_modrinth_version_id}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            irons_lib_version      : irons_lib_version,
            geckolib_version       : geckolib_version,
            irons_artifice_version : irons_artifice_version,
            jei_version            : jei_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' 
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
